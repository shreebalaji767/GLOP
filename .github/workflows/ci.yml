name: GLOP CI

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node src/cli.js build examples/hello.glop

  native-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S runtime/native -B build/native
      - run: cmake --build build/native --config Release
      - run: ./build/native/glop examples/hello.glop
      - run: ./build/native/glop examples/native.glop
      - run: ./build/native/glop examples/stdlib.glop
      - run: ./build/native/glop examples/native-stdlib.glop
      - run: ./build/native/glop examples/native-features.glop
      - run: ./build/native/glop examples/native-system.glop
      - run: ./build/native/glop examples/native-core.glop
      - run: node src/cli.js build examples/hello.glop -o build/hello.gbc
      - run: ./build/native/glop-runtime build/hello.gbc
